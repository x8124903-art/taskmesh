services:

  mysql:
    image: mysql:8.0
    container_name: taskmesh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TaskMesh2024!}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    entrypoint:
      - bash
      - -c
      - |
        cat > /docker-entrypoint-initdb.d/init.sql << 'EOSQL'
        CREATE DATABASE IF NOT EXISTS taskmesh_auth;
        CREATE DATABASE IF NOT EXISTS taskmesh_projects;
        CREATE DATABASE IF NOT EXISTS taskmesh_tasks;

        USE taskmesh_auth;

        CREATE TABLE IF NOT EXISTS User (
            IdUser INT AUTO_INCREMENT PRIMARY KEY,
            Email VARCHAR(255) NOT NULL UNIQUE,
            Name VARCHAR(100) NOT NULL,
            PasswordHash VARCHAR(255) NOT NULL,
            Role VARCHAR(50) NOT NULL DEFAULT 'User',
            CreatedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            UpdatedAt DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            IsDeleted BOOLEAN DEFAULT FALSE,
            INDEX idx_email (Email),
            INDEX idx_role (Role)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        CREATE TABLE IF NOT EXISTS RefreshToken (
            IdRefreshToken INT AUTO_INCREMENT PRIMARY KEY,
            Token VARCHAR(500) NOT NULL UNIQUE,
            UserId INT NOT NULL,
            ExpiresAt DATETIME NOT NULL,
            IsRevoked BOOLEAN DEFAULT FALSE,
            CreatedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            RevokedAt DATETIME NULL,
            INDEX idx_token (Token),
            INDEX idx_user_id (UserId),
            FOREIGN KEY (UserId) REFERENCES User(IdUser) ON DELETE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        USE taskmesh_projects;

        CREATE TABLE IF NOT EXISTS ProjectRole (
            IdProjectRole INT PRIMARY KEY,
            Name VARCHAR(50) NOT NULL UNIQUE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        INSERT INTO ProjectRole (IdProjectRole, Name) VALUES 
            (1, 'Owner'), 
            (2, 'Admin'), 
            (3, 'Member'), 
            (4, 'Viewer')
        ON DUPLICATE KEY UPDATE Name=Name;

        CREATE TABLE IF NOT EXISTS ProjectStatus (
            IdProjectStatus INT PRIMARY KEY,
            Name VARCHAR(50) NOT NULL UNIQUE,
            Description VARCHAR(200)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        INSERT INTO ProjectStatus (IdProjectStatus, Name, Description) VALUES 
            (1, 'Active', 'Proyecto activo en desarrollo'),
            (2, 'Paused', 'Proyecto pausado temporalmente'),
            (3, 'Completed', 'Proyecto completado exitosamente'),
            (4, 'Archived', 'Proyecto archivado')
        ON DUPLICATE KEY UPDATE Name=Name;

        CREATE TABLE IF NOT EXISTS Project (
            IdProject INT AUTO_INCREMENT PRIMARY KEY,
            Name VARCHAR(100) NOT NULL,
            Description VARCHAR(500),
            Status INT NOT NULL,
            CreatedBy INT NOT NULL,
            CreatedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            UpdatedAt DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            IsDeleted BOOLEAN DEFAULT FALSE,
            INDEX idx_created_by (CreatedBy),
            INDEX idx_status (Status),
            FOREIGN KEY (Status) REFERENCES ProjectStatus(IdProjectStatus)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        CREATE TABLE IF NOT EXISTS ProjectMember (
            IdProjectMember INT AUTO_INCREMENT PRIMARY KEY,
            ProjectId INT NOT NULL,
            UserId INT NOT NULL,
            Role INT NOT NULL,
            UserName VARCHAR(100) DEFAULT NULL,
            Email VARCHAR(255) DEFAULT NULL,
            InvitedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            JoinedAt DATETIME NULL,
            INDEX idx_project_id (ProjectId),
            INDEX idx_user_id (UserId),
            INDEX idx_project_user (ProjectId, UserId),
            INDEX idx_role (Role),
            UNIQUE KEY unique_project_user (ProjectId, UserId),
            FOREIGN KEY (ProjectId) REFERENCES Project(IdProject) ON DELETE CASCADE,
            FOREIGN KEY (Role) REFERENCES ProjectRole(IdProjectRole)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        CREATE TABLE IF NOT EXISTS ProjectInvitation (
            IdProjectInvitation INT AUTO_INCREMENT PRIMARY KEY,
            ProjectId INT NOT NULL,
            Email VARCHAR(255) NOT NULL,
            Role INT NOT NULL,
            Token VARCHAR(500) NOT NULL UNIQUE,
            Status VARCHAR(20) NOT NULL DEFAULT 'Pending',
            InvitedByUserId INT NOT NULL,
            InvitedByName VARCHAR(100) DEFAULT NULL,
            InvitedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            ExpiresAt DATETIME NOT NULL,
            AcceptedAt DATETIME NULL,
            RejectedAt DATETIME NULL,
            INDEX idx_token (Token),
            INDEX idx_project (ProjectId),
            INDEX idx_email (Email),
            INDEX idx_status (Status),
            INDEX idx_role (Role),
            FOREIGN KEY (ProjectId) REFERENCES Project(IdProject) ON DELETE CASCADE,
            FOREIGN KEY (Role) REFERENCES ProjectRole(IdProjectRole)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        -- ========================================
        -- TASKMESH_TASKS DATABASE
        -- ========================================

        USE taskmesh_tasks;

        CREATE TABLE IF NOT EXISTS Task (
            IdTask INT AUTO_INCREMENT PRIMARY KEY,
            ProjectId INT NOT NULL,
            Title VARCHAR(200) NOT NULL,
            Description TEXT,
            Status INT NOT NULL DEFAULT 1,
            Priority INT NOT NULL DEFAULT 2,
            AssignedToUserId INT NULL,
            CreatedBy INT NOT NULL,
            DueDate DATETIME NULL,
            CreatedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            UpdatedAt DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            RowVersion INT NOT NULL DEFAULT 1,
            IsDeleted BOOLEAN DEFAULT FALSE,
            DeletedAt DATETIME NULL,
            INDEX idx_project_id (ProjectId),
            INDEX idx_status (Status),
            INDEX idx_priority (Priority),
            INDEX idx_assigned_to (AssignedToUserId),
            INDEX idx_created_by (CreatedBy),
            INDEX idx_is_deleted (IsDeleted),
            INDEX idx_project_status (ProjectId, Status)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        CREATE TABLE IF NOT EXISTS TaskComment (
            IdTaskComment INT AUTO_INCREMENT PRIMARY KEY,
            TaskId INT NOT NULL,
            UserId INT NOT NULL,
            Comment TEXT NOT NULL,
            CreatedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            INDEX idx_task_id (TaskId),
            INDEX idx_user_id (UserId),
            INDEX idx_created_at (CreatedAt),
            FOREIGN KEY (TaskId) REFERENCES Task(IdTask) ON DELETE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        -- ============================================
        -- NOTIFICATIONS DATABASE
        -- ============================================
        CREATE DATABASE IF NOT EXISTS taskmesh_notifications;

        USE taskmesh_notifications;

        CREATE TABLE IF NOT EXISTS Notification (
            IdNotification INT AUTO_INCREMENT PRIMARY KEY,
            UserId INT NOT NULL,
            Type VARCHAR(50) NOT NULL,
            Title VARCHAR(200) NOT NULL,
            Message VARCHAR(500) NOT NULL,
            RelatedEntityType VARCHAR(50) NULL,
            RelatedEntityId INT NULL,
            RelatedProjectId INT NULL,
            IsRead BOOLEAN DEFAULT FALSE,
            CreatedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            INDEX idx_user_id (UserId),
            INDEX idx_is_read (IsRead),
            INDEX idx_created_at (CreatedAt),
            INDEX idx_type (Type)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        CREATE TABLE IF NOT EXISTS ProcessedEvent (
            EventId VARCHAR(100) PRIMARY KEY,
            EventType VARCHAR(100) NOT NULL,
            ProcessedAt DATETIME DEFAULT CURRENT_TIMESTAMP,
            INDEX idx_event_type (EventType)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

        EOSQL
        exec docker-entrypoint.sh mysqld
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskmesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taskmesh-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: taskmesh
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-TaskMesh2024!}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  msauth:
    image: ghcr.io/x8124903-art/ms-auth:${IMAGE_TAG:-main}
    container_name: taskmesh-msauth
    ports:
      - "44310:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Type: MySql
      Database__DefaultConnection: "server=mysql;uid=root;pwd=${MYSQL_ROOT_PASSWORD:-TaskMesh2024!};database=taskmesh_auth"
      RedisCache__ConnectionString: "redis:6379"
      RedisCache__Enabled: "true"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-super-secret-key-change-in-production-min-256-bits}"
      Jwt__Issuer: "taskmesh-auth"
      Jwt__Audience: "taskmesh-api"
      Jwt__AccessTokenExpirationMinutes: "15"
      EventBus__ConnectionString: "amqp://taskmesh:${RABBITMQ_PASSWORD:-TaskMesh2024!}@rabbitmq:5672"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  msgateway:
    image: ghcr.io/x8124903-art/ms-gateway:${IMAGE_TAG:-main}
    container_name: taskmesh-msgateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__SecretKey: "${JWT_SECRET_KEY:-super-secret-key-change-in-production-min-256-bits}"
      Jwt__Issuer: "taskmesh-auth"
      Jwt__Audience: "taskmesh-api"
      Observability__OtlpEndpoint: "http://jaeger:4317"
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: "http://msauth:8080"
      ReverseProxy__Clusters__projects-cluster__Destinations__projects-service__Address: "http://msprojects:8080"
      ReverseProxy__Clusters__tasks-cluster__Destinations__tasks-service__Address: "http://mstasks:8080"
      ReverseProxy__Clusters__notifications-cluster__Destinations__notifications-service__Address: "http://msnotifications:8080"
    depends_on:
      msauth:
        condition: service_healthy
      msprojects:
        condition: service_healthy
      mstasks:
        condition: service_healthy
      msnotifications:
        condition: service_healthy
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  msprojects:
    image: ghcr.io/x8124903-art/ms-projects:${IMAGE_TAG:-main}
    container_name: taskmesh-msprojects
    ports:
      - "44311:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Type: MySql
      Database__DefaultConnection: "server=mysql;uid=root;pwd=${MYSQL_ROOT_PASSWORD:-TaskMesh2024!};database=taskmesh_projects"
      RedisCache__ConnectionString: "redis:6379"
      RedisCache__Enabled: "true"
      EventBus__ConnectionString: "amqp://taskmesh:${RABBITMQ_PASSWORD:-TaskMesh2024!}@rabbitmq:5672"
      MsAuth__BaseUrl: "http://msauth:8080"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      msauth:
        condition: service_healthy
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mstasks:
    image: ghcr.io/x8124903-art/ms-tasks:${IMAGE_TAG:-main}
    container_name: taskmesh-mstasks
    ports:
      - "44312:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Type: MySql
      Database__DefaultConnection: "server=mysql;uid=root;pwd=${MYSQL_ROOT_PASSWORD:-TaskMesh2024!};database=taskmesh_tasks"
      RedisCache__ConnectionString: "redis:6379"
      RedisCache__Enabled: "true"
      MsProjects__BaseUrl: "http://msprojects:8080"
      EventBus__ConnectionString: "amqp://taskmesh:${RABBITMQ_PASSWORD:-TaskMesh2024!}@rabbitmq:5672"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      msprojects:
        condition: service_healthy
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  msnotifications:
    image: ghcr.io/x8124903-art/ms-notifications:${IMAGE_TAG:-main}
    container_name: taskmesh-msnotifications
    ports:
      - "44313:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Type: MySql
      Database__DefaultConnection: "server=mysql;uid=root;pwd=${MYSQL_ROOT_PASSWORD:-TaskMesh2024!};database=taskmesh_notifications"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "taskmesh"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-TaskMesh2024!}"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  webapp:
    image: ghcr.io/x8124903-art/webapp:${IMAGE_TAG:-main}
    container_name: taskmesh-webapp
    ports:
      - "3000:80"
    depends_on:
      - msgateway
    networks:
      - taskmesh-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: taskmesh-jaeger
    ports:
      - "4317:4317"
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - taskmesh-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taskmesh-prometheus
    ports:
      - "9090:9090"
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/prometheus/prometheus.yml << 'EOPROM'
        global:
          scrape_interval: 15s

        scrape_configs:
          - job_name: 'ms-auth'
            static_configs:
              - targets: ['msauth:8080']
            metrics_path: '/metrics'
  
          - job_name: 'ms-projects'
            static_configs:
              - targets: ['msprojects:8080']
            metrics_path: '/metrics'
  
          - job_name: 'ms-tasks'
            static_configs:
              - targets: ['mstasks:8080']
            metrics_path: '/metrics'
  
          - job_name: 'ms-notifications'
            static_configs:
              - targets: ['msnotifications:8080']
            metrics_path: '/metrics'
  
          - job_name: 'ms-gateway'
            static_configs:
              - targets: ['msgateway:8080']
            metrics_path: '/metrics'

        EOPROM
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    depends_on:
      - msauth
      - msgateway
      - msprojects
      - mstasks
      - msnotifications
    networks:
      - taskmesh-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: taskmesh-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - taskmesh-network

networks:
  taskmesh-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  grafana-data:
