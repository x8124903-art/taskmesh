name: ms-tasks CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'MsTasks/**'
      - 'MsTasks.IntegrationTests/**'
      - 'MsTasks.FunctionalTests/**'
      - '.github/workflows/ms-tasks.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'MsTasks/**'
      - 'MsTasks.IntegrationTests/**'
      - 'MsTasks.FunctionalTests/**'

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ms-tasks

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: |
        dotnet test MsTasks/Tests/MsTasks.Tests.csproj \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=unit-tests.trx" \
          --collect:"XPlat Code Coverage" \
          --settings coverage.runsettings \
          --results-directory TestResults/MsTasks

    - name: Run Integration Tests
      run: |
        dotnet test MsTasks.IntegrationTests/MsTasks.IntegrationTests.csproj \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=integration-tests.trx" \
          --results-directory TestResults/MsTasks-Integration

    - name: Run Functional Tests
      run: |
        dotnet test MsTasks.FunctionalTests/MsTasks.FunctionalTests.csproj \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=functional-tests.trx" \
          --results-directory TestResults/MsTasks-Functional

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/MsTasks/**/coverage.cobertura.xml
        flags: ms-tasks
        fail_ci_if_error: false

    - name: Check Coverage Threshold (80%)
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator \
          -reports:TestResults/MsTasks/**/coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:TextSummary
        cat coverage-report/Summary.txt
        LINE_COVERAGE=$(grep -oP 'Line coverage: \K[0-9.]+' coverage-report/Summary.txt || echo "0")
        echo "Line coverage: ${LINE_COVERAGE}%"
        # Convert to integer for comparison (80.5% -> 80)
        LINE_COVERAGE_INT=$(echo "$LINE_COVERAGE" | cut -d. -f1)
        if [ "$LINE_COVERAGE_INT" -lt 80 ]; then
          echo "::error::Coverage ${LINE_COVERAGE}% is below the 80% threshold"
          exit 1
        else
          echo "::notice::Coverage ${LINE_COVERAGE}% meets the 80% threshold ✅"
        fi

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./MsTasks
        file: ./MsTasks/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  docker-release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image with version tag
      uses: docker/build-push-action@v5
      with:
        context: ./MsTasks
        file: ./MsTasks/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        labels: |
          version=${{ steps.version.outputs.VERSION }}
